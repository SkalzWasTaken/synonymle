<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synonymle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --border: #334155;
            --success: #22c55e;
            --error: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 4px;
            background: linear-gradient(to right, #818cf8, #c084fc);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        #round-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 24px;
        }

        #word-prompt {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
            background: rgba(15, 23, 42, 0.4);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        #input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 16px;
        }

        input {
            flex: 1;
            background: var(--bg-color);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
        }

        button {
            background-color: var(--accent);
            color: white;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: var(--border);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        #message {
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 500;
            white-space: pre-line;
            line-height: 1.5;
            text-align: left;
            background: rgba(15, 23, 42, 0.2);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        #next-btn {
            width: 100%;
            margin-top: 16px;
        }

        .correct { color: var(--success); font-weight: 600; }
        .incorrect { color: var(--error); font-weight: 600; }
        .hidden { display: none !important; }

        #score-area h2 {
            font-size: 1.75rem;
            margin-bottom: 12px;
        }

        #score-area p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 24px;
        }

        #score-area button {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Synonymle</h1>
        <div id="game-area">
            <p id="round-info">Round: 1 / 5</p>
            <h3 id="word-prompt">Loading word...</h3>
            <div id="input-area">
                <input type="text" id="user-input" placeholder="Type a synonym..." autocomplete="off">
                <button id="guess-btn" onclick="submitGuess()">Guess</button>
            </div>
            <div id="message" class="hidden"></div>
            <button id="next-btn" class="hidden" onclick="nextRound()">Next Round</button>
        </div>
        <div id="score-area" class="hidden">
            <h2>Game Over!</h2>
            <p id="final-score"></p>
            <button onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        let currentRound = 1;
        let totalScore = 0;
        let currentWordData = null;
        let answered = false;

        async function fetchNewWord() {
            answered = false;
            let msgEl = document.getElementById('message');
            msgEl.innerHTML = "";
            msgEl.classList.add('hidden');
            
            let inputEl = document.getElementById('user-input');
            inputEl.value = "";
            inputEl.disabled = false;
            
            document.getElementById('guess-btn').disabled = false;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('word-prompt').innerText = "Loading word...";

            let response = await fetch('/get_word');
            currentWordData = await response.json();
            document.getElementById('word-prompt').innerText = `Your word is: ${currentWordData.word.toUpperCase()}`;
            inputEl.focus();
        }

        function submitGuess() {
            if (answered || !currentWordData) return;
            let inputEl = document.getElementById('user-input');
            let guess = inputEl.value.trim().toLowerCase();
            if (!guess) return;

            answered = true;
            inputEl.disabled = true;
            document.getElementById('guess-btn').disabled = true;

            let normalizedSynonyms = currentWordData.synonyms.map(s => s.toLowerCase().trim());
            let isCorrect = normalizedSynonyms.includes(guess);

            let messageEl = document.getElementById('message');
            messageEl.classList.remove('hidden');
            let scoreText = "";

            if (isCorrect) {
                let pts = Math.round((10 - currentWordData.score) * 10);
                totalScore += pts;
                scoreText = `<span class="correct">Correct! You scored ${pts} points.</span>`;
            } else {
                scoreText = `<span class="incorrect">Not a synonym. You scored 0 points.</span>`;
            }

            let synonymList = currentWordData.synonyms.join(', ');
            messageEl.innerHTML = `${scoreText}<br><br><strong>Synonyms:</strong> ${synonymList}`;

            if (currentRound < 5) {
                let nextBtn = document.getElementById('next-btn');
                nextBtn.classList.remove('hidden');
                nextBtn.focus();
            } else {
                document.getElementById('next-btn').classList.add('hidden');
                setTimeout(() => {
                    document.getElementById('game-area').classList.add('hidden');
                    document.getElementById('score-area').classList.remove('hidden');
                    document.getElementById('final-score').innerText = `Your total score is: ${totalScore}`;
                }, 2500);
            }
        }

        function nextRound() {
            currentRound++;
            document.getElementById('round-info').innerText = `Round: ${currentRound} / 5`;
            fetchNewWord();
        }

        function restartGame() {
            currentRound = 1;
            totalScore = 0;
            document.getElementById('round-info').innerText = `Round: 1 / 5`;
            document.getElementById('score-area').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            fetchNewWord();
        }

        document.getElementById('user-input').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                if (!answered) {
                    submitGuess();
                } else if (currentRound < 5) {
                    nextRound();
                }
            }
        });

        fetchNewWord();
    </script>
</body>
</html>
