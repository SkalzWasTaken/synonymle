<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Synonymle</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0d1b1e;
            --card-bg: #132226;
            --text-primary: #f0fdf4;
            --text-secondary: #94a3b8;
            --accent: #16a34a;
            --accent-hover: #15803d;
            --accent-glow: rgba(22, 163, 74, 0.25);
            --border: #23383e;
            --success: #22c55e;
            --error: #facc15;
            --input-bg: #0d1b1e;
            --prompt-bg: rgba(13, 27, 30, 0.6);
            --message-bg: rgba(13, 27, 30, 0.4);
        }

        [data-theme="light"] {
            --bg-color: #f4f6f8;
            --card-bg: #ffffff;
            --text-primary: #132226;
            --text-secondary: #64748b;
            --accent: #16a34a;
            --accent-hover: #15803d;
            --accent-glow: rgba(22, 163, 74, 0.15);
            --border: #e2e8f0;
            --success: #16a34a;
            --error: #ca8a04;
            --input-bg: #f8fafc;
            --prompt-bg: rgba(22, 163, 74, 0.05);
            --message-bg: rgba(241, 245, 249, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            transition: background-color 0.2s ease, color 0.2s ease, border-color 0.2s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .card {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.15);
            text-align: center;
            position: relative;
        }

        .header-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 4px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            background: linear-gradient(to right, #4ade80, #fde047);
            background-clip: text;
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-align: left;
        }

        .theme-toggle {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.85rem;
            cursor: pointer;
            font-weight: 600;
        }

        .theme-toggle:hover {
            border-color: var(--accent);
        }

        #round-info {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 24px;
            text-align: left;
        }

        #word-prompt {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 20px;
            color: var(--text-primary);
            background: var(--prompt-bg);
            padding: 14px;
            border-radius: 10px;
            border: 1px solid var(--border);
        }

        #input-area {
            display: flex;
            gap: 10px;
            margin-bottom: 8px;
        }

        .input-hint {
            font-size: 0.8rem;
            color: var(--text-secondary);
            text-align: left;
            margin-bottom: 16px;
            padding-left: 2px;
        }

        input {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 12px 16px;
            color: var(--text-primary);
            font-size: 1rem;
            outline: none;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        button.action-btn {
            background-color: var(--accent);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: 12px 20px;
            font-weight: 700;
            cursor: pointer;
        }

        button.action-btn:hover {
            background-color: var(--accent-hover);
        }

        button.action-btn:active {
            transform: scale(0.98);
        }

        button.action-btn:disabled {
            background: var(--border);
            color: var(--text-secondary);
            cursor: not-allowed;
            transform: none;
        }

        #message {
            margin-top: 15px;
            font-size: 0.95rem;
            font-weight: 500;
            white-space: pre-line;
            line-height: 1.5;
            text-align: left;
            background: var(--message-bg);
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        #next-btn {
            width: 100%;
            margin-top: 16px;
        }

        .correct { color: var(--success); font-weight: 600; }
        .incorrect { color: var(--error); font-weight: 600; }
        .hidden { display: none !important; }

        #score-area h2 {
            font-size: 1.75rem;
            margin-bottom: 12px;
            color: var(--accent);
        }

        #score-area p {
            color: var(--text-secondary);
            font-size: 1.1rem;
            margin-bottom: 24px;
        }

        #score-area button {
            width: 100%;
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="header-row">
            <h1>Synonymle</h1>
            <button class="theme-toggle" onclick="toggleTheme()">☀️ / 🌙</button>
        </div>
        <div id="game-area">
            <p id="round-info">Round: 1 / 5</p>
            <h3 id="word-prompt">Loading word...</h3>
            <div id="input-area">
                <input type="text" id="user-input" placeholder="Type a synonym..." autocomplete="off">
                <button class="action-btn" id="guess-btn" onclick="submitGuess()">Guess</button>
            </div>
            <div class="input-hint">💡 Tip: Type verbs in their base form (e.g., "drop", not "dropped").</div>
            <div id="message" class="hidden"></div>
            <button class="action-btn hidden" id="next-btn" onclick="nextRound()">Next Round</button>
        </div>
        <div id="score-area" class="hidden">
            <h2>Game Over!</h2>
            <p id="final-score"></p>
            <button class="action-btn" onclick="restartGame()">Play Again</button>
        </div>
    </div>

    <script>
        // Theme initialization
        const savedTheme = localStorage.getItem('theme') || 'dark';
        document.documentElement.setAttribute('data-theme', savedTheme);

        function toggleTheme() {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', newTheme);
            localStorage.setItem('theme', newTheme);
        }

        let currentRound = 1;
        let totalScore = 0;
        let currentWordData = null;
        let answered = false;

        async function fetchNewWord() {
            answered = false;
            let msgEl = document.getElementById('message');
            msgEl.innerHTML = "";
            msgEl.classList.add('hidden');
            
            let inputEl = document.getElementById('user-input');
            inputEl.value = "";
            inputEl.disabled = false;
            
            document.getElementById('guess-btn').disabled = false;
            document.getElementById('next-btn').classList.add('hidden');
            document.getElementById('word-prompt').innerText = "Loading word...";

            let response = await fetch('/get_word');
            currentWordData = await response.json();
            document.getElementById('word-prompt').innerText = `Your word is: ${currentWordData.word.toUpperCase()}`;
            inputEl.focus();
        }

        async function submitGuess() {
            if (answered || !currentWordData) return;
            let inputEl = document.getElementById('user-input');
            let guess = inputEl.value.trim().toLowerCase();
            if (!guess) return;

            let response = await fetch('/check_guess', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ target: currentWordData.word, guess: guess })
            });
            let result = await response.json();

            let messageEl = document.getElementById('message');
            messageEl.classList.remove('hidden');

            if (result.status === 'not_a_word') {
                messageEl.innerHTML = `<span class="incorrect">Not a word. Please enter a valid word.</span>`;
                return;
            }

            answered = true;
            inputEl.disabled = true;
            document.getElementById('guess-btn').disabled = true;

            let scoreText = "";
            if (result.status === 'correct') {
                let pts = Math.round((10 - currentWordData.score) * 10);
                totalScore += pts;
                scoreText = `<span class="correct">Correct! You scored ${pts} points.</span>`;
            } else {
                scoreText = `<span class="incorrect">Not a synonym. You scored 0 points.</span>`;
            }

            let synonymList = result.synonyms.join(', ');
            messageEl.innerHTML = `${scoreText}<br><br><strong>Synonyms:</strong> ${synonymList}`;

            if (currentRound < 5) {
                let nextBtn = document.getElementById('next-btn');
                nextBtn.classList.remove('hidden');
                nextBtn.focus();
            } else {
                document.getElementById('next-btn').classList.add('hidden');
                setTimeout(() => {
                    document.getElementById('game-area').classList.add('hidden');
                    document.getElementById('score-area').classList.remove('hidden');
                    document.getElementById('final-score').innerText = `Your total score is: ${totalScore}`;
                }, 2500);
            }
        }

        function nextRound() {
            currentRound++;
            document.getElementById('round-info').innerText = `Round: ${currentRound} / 5`;
            fetchNewWord();
        }

        function restartGame() {
            currentRound = 1;
            totalScore = 0;
            document.getElementById('round-info').innerText = `Round: 1 / 5`;
            document.getElementById('score-area').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            fetchNewWord();
        }

        document.getElementById('user-input').addEventListener('keydown', function(event) {
            if (event.key === 'Enter') {
                event.preventDefault();
                if (!answered) {
                    submitGuess();
                } else if (currentRound < 5) {
                    nextRound();
                }
            }
        });

        fetchNewWord();
    </script>
</body>
</html>
